services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/tracecare.db}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      LLM_MODE: ${LLM_MODE:-disabled}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      LOCAL_LLM_TIMEOUT_SECONDS: ${LOCAL_LLM_TIMEOUT_SECONDS:-120}
      DEVICE_ADAPTER_MODE: ${DEVICE_ADAPTER_MODE:-simulated}
      DEVICE_SERIAL_PORT: ${DEVICE_SERIAL_PORT:-}
      DEVICE_SERIAL_BAUD_RATE: ${DEVICE_SERIAL_BAUD_RATE:-115200}
      DEVICE_SERIAL_TIMEOUT_SECONDS: ${DEVICE_SERIAL_TIMEOUT_SECONDS:-1.0}
      DEVICE_HEARTBEAT_TIMEOUT_SECONDS: ${DEVICE_HEARTBEAT_TIMEOUT_SECONDS:-3.0}
      DEMO_MANAGEMENT_ENABLED: ${DEMO_MANAGEMENT_ENABLED:-true}
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001/api}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  backend_data:
